name: Compilar APK Estados HD

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compilar
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log || { grep -E "^e: |error:|What went wrong" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk EstadosHD.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EstadosHD-APK
          path: EstadosHD.apk
      - name: Publicar link de descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.6.${{ github.run_number }}
          name: Estados HD v3.6.${{ github.run_number }}
          make_latest: true
          files: EstadosHD.apk
