name: Compilar APK Estados HD

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compilar
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk EstadosHD.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EstadosHD-APK
          path: EstadosHD.apk
      - name: Publicar link de descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Estados HD v2.0.${{ github.run_number }}
          make_latest: true
          files: EstadosHD.apk
